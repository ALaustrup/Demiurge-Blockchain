<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Starship Genesis - Demiurge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "phaser": "https://esm.sh/phaser@3.70.0",
          "tone": "https://esm.sh/tone@14.7.77"
        }
      }
    </script>
    <style>
      html, body { 
        margin: 0; 
        padding: 0; 
        background-color: black; 
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Phaser Game Container -->
    <div id="game-container"></div>
    
    <!-- Demiurge HUD Injection - Enables blockchain integration -->
    <script>
      // Try to load HUD from parent context or fallback gracefully
      (function() {
        const script = document.createElement('script');
        script.src = '/inject-hud.js';
        script.onerror = function() {
          console.warn('HUD injection script not available - running in standalone mode');
          // Create a mock DemiurgeHUD for standalone mode
          window.DemiurgeHUD = {
            init: function() { console.log('DemiurgeHUD: Standalone mode'); },
            update: function() {},
            showTransaction: function() {},
            isAvailable: false
          };
        };
        document.head.appendChild(script);
      })();
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
