[package]
name = "demiurge-primitives"
version = "0.1.0"
edition = "2021"
description = "Core primitives for the Demiurge Protocol"
license = "MIT"

[features]
default = ["ed25519"]
ed25519 = []
pqc = ["pqcrypto-dilithium", "pqcrypto-traits"]
full = ["ed25519", "pqc"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
blake2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"

# Post-Quantum Cryptography (optional)
pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

[dev-dependencies]
rand = "0.8"
