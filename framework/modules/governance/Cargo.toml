[package]
name = "demiurge-module-governance"
version = "0.1.0"
edition = "2021"
authors = ["Demiurge Protocol Team"]
description = "On-chain governance module for the Demiurge Protocol"
license = "MIT"
repository = "https://github.com/Alaustrup/Demiurge-Blockchain"

[dependencies]
# Serialization
codec = { package = "parity-scale-codec", version = "3.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
blake2 = "0.10"
hex = "0.4"

# Internal dependencies
demiurge-storage = { path = "../../storage" }

[dev-dependencies]
