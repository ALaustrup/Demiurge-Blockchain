[package]
name = "demiurge-game-registry"
version = "0.1.0"
edition = "2021"
authors = ["Demiurge Team"]
description = "On-chain game registry module for Demiurge blockchain"
repository = "https://github.com/Alaustrup/Demiurge-Blockchain"
license = "MIT"

[dependencies]
demiurge-core = { path = "../../core" }
demiurge-storage = { path = "../../storage" }
demiurge-balances = { path = "../balances" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
