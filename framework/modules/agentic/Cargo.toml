[package]
name = "demiurge-agentic"
version = "0.1.0"
edition = "2021"
description = "Agentic Integration Layer for Demiurge Protocol - Sovereign AI Agents"
license = "MIT"
authors = ["Demiurge Protocol"]

[dependencies]
# Demiurge primitives
demiurge-primitives = { path = "../../primitives" }
demiurge-qor-identity = { path = "../qor-identity" }
demiurge-module-drc369 = { path = "../drc369" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parity-scale-codec = { version = "3.6", features = ["derive"] }
scale-info = { version = "2.10", features = ["derive"] }

# Crypto
blake3 = "1.5"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"

# ZK Proofs (optional)
plonky2 = { version = "0.2", optional = true }
plonky2_field = { version = "0.2", optional = true }

# Async
tokio = { version = "1.35", features = ["full"], optional = true }

# Vector operations
ndarray = { version = "0.15", optional = true }

[features]
default = ["std"]
std = ["tokio"]
pqc = ["demiurge-primitives/pqc"]
vector-state = ["ndarray"]
zk-vcp = ["plonky2", "plonky2_field"]
full = ["std", "pqc", "vector-state", "zk-vcp"]

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
