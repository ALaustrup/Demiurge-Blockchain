[package]
name = "demiurge-qor-identity"
version = "0.1.0"
edition = "2021"
description = "Qor Identity - Sovereign Identity System for Demiurge"
license = "MIT"

[dependencies]
demiurge-primitives = { path = "../../primitives" }
demiurge-storage = { path = "../../storage" }
demiurge-modules = { path = ".." }

codec = { package = "parity-scale-codec", version = "3.6", features = ["derive"] }
scale-info = { version = "2.11", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake2 = "0.10"
hex = "0.4"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
