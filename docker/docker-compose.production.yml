# Demiurge Blockchain Production Docker Compose
# Location: docker/docker-compose.production.yml
# Deploy with: docker compose -f docker/docker-compose.production.yml up -d

version: "3.9"

services:
  # Nginx Reverse Proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: demiurge-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/production/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - demiurge-network
    depends_on:
      - hub
      - qor-auth
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Hub Web Application (Next.js)
  hub:
    build:
      context: ..
      dockerfile: apps/hub/Dockerfile
    container_name: demiurge-hub
    restart: always
    env_file:
      - ../apps/hub/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    networks:
      - demiurge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # QOR Auth Service (Rust/Axum)
  qor-auth:
    build:
      context: ../services/qor-auth
      dockerfile: Dockerfile
    container_name: demiurge-qor-auth
    restart: always
    env_file:
      - ../services/qor-auth/.env
    environment:
      - RUST_LOG=info,qor_auth=debug
    expose:
      - "8080"
    volumes:
      - qor-auth-data:/data
    networks:
      - demiurge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for QOR Auth
  postgres:
    image: postgres:16-alpine
    container_name: demiurge-postgres
    restart: always
    environment:
      POSTGRES_USER: demiurge
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: qor_auth
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../services/qor-auth/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - demiurge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demiurge -d qor_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for session caching
  redis:
    image: redis:7-alpine
    container_name: demiurge-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - demiurge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  demiurge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  redis-data:
  qor-auth-data:

secrets:
  postgres_password:
    file: ../config/production/secrets/postgres_password
